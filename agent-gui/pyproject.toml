[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eagleeye-agent"
description = "EagleEye pipeline agent for the UMEagleEye CAASM platform"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "keyring>=25.0",                # secrets in the OS credential store
]

[project.optional-dependencies]
passive = ["scapy>=2.5.0"]          # ARP / mDNS / NetBIOS / DHCP sniffing
snmp    = ["pysnmp>=6.2"]           # SNMPv3 polling of network devices
gui     = ["PySide6>=6.7"]          # the desktop app
build   = ["pyinstaller>=6.10"]     # packaging/build.ps1
dev     = ["pytest>=8.0", "python-nmap>=0.7.1", "requests>=2.31.0"]   # python-nmap, requests: only to run the original agent in tests/test_parity.py

[project.scripts]
eagleeye = "eagleeye.cli:main"

[project.gui-scripts]
eagleeye-gui = "eagleeye.gui:main"

[tool.setuptools.dynamic]
version = { attr = "eagleeye.VERSION" }

[tool.setuptools.packages.find]
include = ["eagleeye*"]

[tool.setuptools.package-data]
"eagleeye.collectors" = ["*.ps1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
